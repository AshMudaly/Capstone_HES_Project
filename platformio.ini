; Solar-hybrid propulsion testbed: Freenove Control Board V5 (Uno R4 WiFi layout).
; Build one sketch at a time:  pio run -e logger  |  pio run -e esc_setup
; Upload: add  -t upload   Serial Monitor: pio device monitor

[platformio]
default_envs = logger

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit INA260 Library
    bogde/HX711
    arduino-libraries/SD
    arduino-libraries/Servo

[env:logger]
build_src_filter = -<*> +<logger/>

[env:esc_setup]
build_src_filter = -<*> +<esc_setup/>

[env:hx711_diag]
build_src_filter = -<*> +<hx711_diag/>
lib_deps = bogde/HX711
