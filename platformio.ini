; Solar-hybrid propulsion testbed: Freenove Control Board V5 (Uno R4 WiFi layout).
; Build one sketch at a time:  pio run -e logger  |  pio run -e esc_setup
; Upload: add  -t upload   Serial Monitor: pio device monitor

[platformio]
default_envs = logger

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/SD

[env:logger]
build_src_filter = -<*> +<logger/>

[env:esc_setup]
build_src_filter = -<*> +<esc_setup/>

[env:hx711_diag]
build_src_filter = -<*> +<hx711_diag/>
lib_deps = bogde/HX711

[env:hx711_bits]
build_src_filter = -<*> +<hx711_bits/>

[env:pwm_check]
build_src_filter = -<*> +<pwm_check/>

[env:ina_diag]
build_src_filter = -<*> +<ina_diag/>

; ina_diag plus one logger feature each. Run in this order, about 5 min each, stop at the first one that fails.
[env:ina_servo]
build_src_filter = -<*> +<ina_diag/>
build_flags = -DWITH_SERVO
lib_deps =
    arduino-libraries/Servo

[env:ina_hx]
build_src_filter = -<*> +<ina_diag/>
build_flags = -DWITH_HX711

[env:ina_sd]
build_src_filter = -<*> +<ina_diag/>
build_flags = -DWITH_SD

; Servo build failed (I2C NACKs). Same ESC pin and pulse, but from a hardware PWM timer with no interrupt.
[env:ina_pwm]
build_src_filter = -<*> +<ina_diag/>
build_flags = -DWITH_PWM

; The first logger sweep with the PWM build still lost an INA260 read 0.5 s after g. What changes at g is the
; per-row SD writes and the per-row Serial output, so test each alone (USB power only, about 3 min each).
[env:ina_sdw]
build_src_filter = -<*> +<ina_diag/>
build_flags = -DWITH_SD -DWITH_SDWRITE

[env:ina_rows]
build_src_filter = -<*> +<ina_diag/>
build_flags = -DWITH_ROWS

; Diagnostic builds of the real logger. Every logger run so far has ended within 15 s of g with an INA260 read
; failure. Each of these leaves out one of the two things that start at g, to see which one the failure needs.
[env:logger_nosd]
build_src_filter = -<*> +<logger/>
build_flags = -DNO_SD_ROWS

[env:logger_noserial]
build_src_filter = -<*> +<logger/>
build_flags = -DNO_SERIAL_ROWS

; The load cell outliers vanish when the per-row SD writes are off (logger_nosd), and are not caused by the Serial
; rows. This is the normal logger (SD writes on) plus two extra CSV columns timing every HX711 read, to tell a
; stretched SCK clock (timing) from a normal clock with corrupted data (electrical).
[env:logger_hxtime]
build_src_filter = -<*> +<logger/>
build_flags = -DHX_TIMING

 [env:logger_hold]
  build_src_filter = -<*> +<logger/>
  build_flags = -DNO_SD_ROWS -DHOLD_PROFILE

; Address check for the three INA260s (0x40, 0x41, 0x44). USB power only, no pack, no panels.
[env:ina_scan]
build_src_filter = -<*> +<ina_scan/>

[env:calibrate]
extends = env:logger
build_src_filter = -<*> +<calibrate.cpp>